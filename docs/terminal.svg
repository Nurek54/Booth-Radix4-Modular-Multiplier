<text class="l cmd t0" x="22" y="58">&gt; .\booth_sim.exe -1234 5678 16</text><text class="l out t1" x="22" y="76"></text><text class="l dim t2" x="22" y="94">Mnoznik binarnie: 111111101100101110</text><text class="l dim t3" x="22" y="112">Mnozna binarnie:  000001011000101110</text><text class="l out t4" x="22" y="130"></text><text class="l hw t5" x="22" y="148">Wynik (BoothRadix4, Verilog): -7006652</text><text class="l dim t6" x="22" y="166">Cykle zegara: 11 (zaladowanie, 9 krokow radix-4, zapis wyniku)</text><text class="l dim t7" x="22" y="184">Czas symulacji: 6.036 us, przebiegi: waveform.vcd</text><text class="l out t8" x="22" y="202">Wynik po modulo (BoothRadix4): 5379  (2^n - 3 = 65533, krokow redukcji 3H + L: 1)</text><text class="l out t9" x="22" y="220"></text><text class="l sw t10" x="22" y="238">Wynik (Booth, C++): -7006652</text><text class="l dim t11" x="22" y="256">Iteracje: 18 (radix-2), czas: 0.999 us</text><text class="l out t12" x="22" y="274">Wynik po modulo (Booth): 5379  (2^n - 3 = 65533, krokow redukcji 3H + L: 1)</text><text class="l out t13" x="22" y="292"></text><text class="l ok t14" x="22" y="310">Dokladnie: -1234 * 5678 = -7006652, modulo 65533 = 5379</text><text class="l out t15" x="22" y="328"></text><text class="l cmd t16" x="22" y="346">&gt; .\booth_sim.exe test</text><text class="l out t17" x="22" y="364">Test: 100169 par (169 brzegowych i 100000 losowych), argumenty 18-bitowe ze znakiem</text><text class="l out t18" x="22" y="382">  BoothRadix4 (Verilog): 100169 / 100169 poprawnych, 11 cykli zegara na mnozenie, 702.817 ns symulacji</text><text class="l out t19" x="22" y="400">  Booth (C++):           100169 / 100169 poprawnych, 18 iteracji na mnozenie, 787.184 ns</text><text class="l out t20" x="22" y="418">  Modulo 2^n - 3:        100169 / 100169 poprawnych (losowe n od 2 do 40)</text><text class="l ok t21" x="22" y="436">WYNIK: OK</text>
